<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>FISCH | Field Notes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/webp" href="./ASSets/FischWikiLogo.webp">  
</head>
<body data-theme="dark">
    <header>
        <nav>
            <a href="index.html" data-i18n="nav.home">Home</a>
            <a href="about.html" data-i18n="nav.about">About</a>
            <div class="language-switch" role="group" aria-label="Choose language" data-i18n-aria-label="language.choose">
                <button type="button" data-language="en" aria-pressed="true">🇬🇧 ENG</button>
                <button type="button" data-language="id" aria-pressed="false">🇮🇩 ID</button>
            </div>
            <button class="theme-toggle" type="button" aria-label="Switch to light mode">who actually uses light mode 🫩✌️🥀</button>
        </nav>
        <a class="brand" href="#" aria-label="FISCH home" data-i18n-aria-label="brand.home">FISCH<span>FIELD NOTES</span></a>
        <br>
    </header>
    <main>
        <h1 class="wassup-guys" data-i18n="quiz.title">FISCH Quiz</h1>
        <p class="quiz-hint" data-i18n="quiz.instructions">Pick the correct answer for each question.</p>

        <!-- Edit each question and its answers. Set data-correct-answer to the value of the right answer. -->
        <form class="quiz-form">
            <p class="quiz-progress" role="status" aria-live="polite"></p>
            <fieldset class="quiz-question" data-correct-answer="answer-a">
                <legend tabindex="-1" data-i18n="quiz.question1">Who is the developer of FISCH?</legend>
                <label class="quiz-option">
                    <input type="radio" name="answer-1" value="answer-a" required>
                    <span data-i18n="quiz.question1.optionA">WoozyNate</span>
                </label>
                <label class="quiz-option">
                    <input type="radio" name="answer-1" value="answer-b">
                    <span data-i18n="quiz.question1.optionB">Bamrahe</span>
                </label>
                <label class="quiz-option">
                    <input type="radio" name="answer-1" value="answer-c">
                    <span data-i18n="quiz.question1.optionC">WoozyBam</span>
                </label>
                <label class="quiz-option">
                    <input type="radio" name="answer-1" value="answer-d">
                    <span data-i18n="quiz.question1.optionD">FischNate</span>
                </label>
            </fieldset>
            <fieldset class="quiz-question" data-correct-answer="answer-a" hidden disabled>
                <legend tabindex="-1" data-i18n="quiz.question2">What do players mainly catch in Fisch?</legend>
                <label class="quiz-option">
                    <input type="radio" name="answer-2" value="answer-a" required>
                    <span data-i18n="quiz.question2.optionA">Fish</span>
                </label>
                <label class="quiz-option">
                    <input type="radio" name="answer-2" value="answer-b">
                    <span data-i18n="quiz.question2.optionB">Butterflies</span>
                </label>
                <label class="quiz-option">
                    <input type="radio" name="answer-2" value="answer-c">
                    <span data-i18n="quiz.question2.optionC">Rocks</span>
                </label>
                <label class="quiz-option">
                    <input type="radio" name="answer-2" value="answer-d">
                    <span data-i18n="quiz.question2.optionD">Flowers</span>
                </label>
            </fieldset>
            <fieldset class="quiz-question" data-correct-answer="answer-b" hidden disabled>
                <legend tabindex="-1" data-i18n="quiz.question3">Where can you check which fish you have caught?</legend>
                <label class="quiz-option">
                    <input type="radio" name="answer-3" value="answer-a" >
                    <span data-i18n="quiz.question3.optionA">The Bestiary</span>
                </label>
                <label class="quiz-option">
                    <input type="radio" name="answer-3" value="answer-b" required>
                    <span data-i18n="quiz.question3.optionB">The map legend</span>
                </label>
                <label class="quiz-option">
                    <input type="radio" name="answer-3" value="answer-c">
                    <span data-i18n="quiz.question3.optionC">The boat menu</span>
                </label>
                <label class="quiz-option">
                    <input type="radio" name="answer-3" value="answer-d">
                    <span data-i18n="quiz.question3.optionD">The settings menu</span>
                </label>
            </fieldset>
            <div class="quiz-actions">
                <button class="start-button quiz-next" type="submit" data-i18n="quiz.next">Next question</button>
                <button class="quiz-reset" type="button" data-i18n="quiz.reset">Start over</button>
            </div>
        </form>
        <section class="quiz-result" aria-live="polite" hidden>
            <h2 tabindex="-1" data-i18n="quiz.complete">Quiz complete!</h2>
            <p class="quiz-score"></p>
            <button class="start-button quiz-restart" type="button" data-i18n="quiz.playAgain">Play again</button>
        </section>
    </main>   

    <footer id="socials">
        <p data-i18n="footer.follow">Find me online</p>
        <div class="social-links">
            <a href="https://www.roblox.com/users/2767134392/profile" aria-label="Roblox profile" data-i18n-aria-label="social.roblox">
                <img src="ASSets/roblox.png" alt=""></a>
            <a href="https://www.youtube.com/@Bamrahe-yj4jj" aria-label="YouTube channel" data-i18n-aria-label="social.youtube">
                    <img src="ASSets/youtube.png" alt=""></a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
