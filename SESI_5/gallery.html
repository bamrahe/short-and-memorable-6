<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title data-title="gallery">Gallery</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header>
			<nav>
				<a href="index.html" data-i18n="nav.home">Home</a>
				<a href="sesi_5.html" data-i18n="nav.portfolio">Portfolio</a>
				<a href="about.html" data-i18n="nav.about">About</a>
				<div class="language-switch" role="group" aria-label="Choose language" data-i18n-aria-label="language.choose">
					<button type="button" data-language="en" aria-pressed="true">🇬🇧 ENG</button>
					<button type="button" data-language="id" aria-pressed="false">🇮🇩 ID</button>
				</div>
				<button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
					<span class="theme-toggle__icon" aria-hidden="true">☾</span>
				</button>
			</nav>
			<h1 data-i18n="gallery.heading">Gallery</h1>
		</header>

		<main>
			<section class="gallery-section" aria-label="Photo gallery" data-i18n-aria-label="gallery.ariaLabel">
				<div class="gallery" data-gallery>
					<div class="gallery__viewport">
						<div class="gallery__track">
							<figure class="gallery__slide is-active">
								<div class="gallery-art gallery-art--portrait">
									<img src="./assets/bam.jpg" alt="Portrait of Abraham" />
								</div>
								<figcaption data-i18n="gallery.caption1">Abraham, ready to learn something new.</figcaption>
							</figure>
				            <figure class="gallery__slide">
								<div class="gallery-art gallery-art--video">
				                    <img src="./assets/osk.jpg" alt="My Healthy Calendar project presentation">
								</div>
								<figcaption data-i18n="gallery.caption2">"MY HEALTHY CALENDAR" using MIT App Inventor</figcaption>
								<span><a class="watch-video" href="https://www.youtube.com/watch?v=kbYy32ONxqE" target="_blank" rel="noopener noreferrer"><span class="youtube-logo" aria-hidden="true"></span><span data-i18n="gallery.watchVideo">Watch Video</span></a></span>
							</figure>
                            <figure class="gallery__slide">
								<div class="gallery-art gallery-art--video">
				                    <img src="./assets/bouncetheball.jpg" alt="Bounce the Ball project presentation">
								</div>
								<figcaption data-i18n="gallery.caption3">Bounce the Ball using Camera Sensing in Scratch</figcaption>
								<span><a class="watch-video" href="https://www.youtube.com/watch?v=5o2wCfmfdzw" target="_blank" rel="noopener noreferrer"><span class="youtube-logo" aria-hidden="true"></span><span data-i18n="gallery.watchVideo">Watch Video</span></a></span>
							</figure>
							<figure class="gallery__slide">
								<div class="gallery-art gallery-art--video">
                                    <img src="./assets/lombamakankrupuk.jpg" alt="Lomba Makan Krupuk project presentation">
								</div>
								<figcaption data-i18n="gallery.caption4">Lomba Makan Krupuk</figcaption>
								<span><a class="watch-video" href="https://www.youtube.com/watch?v=TBDztaadeJQ" target="_blank" rel="noopener noreferrer"><span class="youtube-logo" aria-hidden="true"></span><span data-i18n="gallery.watchVideo">Watch Video</span></a></span>
							</figure>
						</div>
					</div>

					<div class="gallery__controls">
						<button class="gallery__arrow" type="button" data-gallery-prev aria-label="Previous image" data-i18n-aria-label="gallery.previous">←</button>
						<div class="gallery__dots" aria-label="Choose a gallery image" data-i18n-aria-label="gallery.chooseImage">
							<button class="gallery__dot is-active" type="button" data-gallery-dot="0" aria-label="Show image 1" aria-current="true"></button>
							<button class="gallery__dot" type="button" data-gallery-dot="1" aria-label="Show image 2" aria-current="false"></button>
							<button class="gallery__dot" type="button" data-gallery-dot="2" aria-label="Show image 3" aria-current="false"></button>
							<button class="gallery__dot" type="button" data-gallery-dot="3" aria-label="Show image 4" aria-current="false"></button>
						</div>
						<button class="gallery__arrow" type="button" data-gallery-next aria-label="Next image" data-i18n-aria-label="gallery.next">→</button>
					</div>
				</div>
			</section>
		</main>

		<footer>
			<p data-i18n="footer">abam &copy; 2026</p>
            <div class="sosmed">
                <a href="https://www.instagram.com/siscaromana"><img src="./assets/instagram.png"></a>
                <a href="https://www.roblox.com/users/2767134392/profile"><img src="./assets/roblox.png"></a>
                <a href="https://www.youtube.com/@Bamrahe-yj4jj"><img src="./assets/youtube.png"></a>
            </div>
		</footer>
		<script src="script.js"></script>
	</body>
</html>
