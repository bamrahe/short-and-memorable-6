<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gallery</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header>
			<nav>
				<a href="index.html">Home</a>
				<a href="sesi_5.html">Portfolio</a>
				<a href="about.html">About</a>
				<button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
					<span class="theme-toggle__icon" aria-hidden="true">☾</span>
				</button>
			</nav>
			<h1>Gallery</h1>
		</header>

		<main>
			<section class="gallery-section" aria-label="Photo gallery">
				<div class="gallery" data-gallery>
					<div class="gallery__viewport">
						<div class="gallery__track">
							<figure class="gallery__slide is-active">
								<div class="gallery-art gallery-art--portrait">
									<img src="./assets/bam.png" alt="Portrait of Abraham" />
								</div>
								<figcaption>Abraham, ready to learn something new.</figcaption>
							</figure>
				            <figure class="gallery__slide">
								<div class="gallery-art gallery-art--video">
				                    <img src="./assets/osk.png" alt="My Healthy Calendar project presentation">
								</div>
								<figcaption>"MY HEALTHY CALENDAR" using MIT App Inventor</figcaption>
                                <span><a class="watch-video" href="https://www.youtube.com/watch?v=kbYy32ONxqE" target="_blank" rel="noopener noreferrer"><span class="youtube-logo" aria-hidden="true"></span>Watch Video</a></span>
							</figure>
                            <figure class="gallery__slide">
								<div class="gallery-art gallery-art--video">
				                    <img src="./assets/bouncetheball.png" alt="Bounce the Ball project presentation">
								</div>
								<figcaption>Bounce the Ball using Camera Sensing in Scratch</figcaption>
                                <span><a class="watch-video" href="https://www.youtube.com/watch?v=5o2wCfmfdzw" target="_blank" rel="noopener noreferrer"><span class="youtube-logo" aria-hidden="true"></span>Watch Video</a></span>
							</figure>
							<figure class="gallery__slide">
								<div class="gallery-art gallery-art--video">
                                    <img src="./assets/lombamakankrupuk.png" alt="Lomba Makan Krupuk project presentation">
								</div>
								<figcaption>Lomba Makan Krupuk</figcaption>
                                <span><a class="watch-video" href="https://www.youtube.com/watch?v=TBDztaadeJQ" target="_blank" rel="noopener noreferrer"><span class="youtube-logo" aria-hidden="true"></span>Watch Video</a></span>   
							</figure>
						</div>
					</div>

					<div class="gallery__controls">
						<button class="gallery__arrow" type="button" data-gallery-prev aria-label="Previous image">←</button>
						<div class="gallery__dots" aria-label="Choose a gallery image">
							<button class="gallery__dot is-active" type="button" data-gallery-dot="0" aria-label="Show image 1" aria-current="true"></button>
							<button class="gallery__dot" type="button" data-gallery-dot="1" aria-label="Show image 2" aria-current="false"></button>
							<button class="gallery__dot" type="button" data-gallery-dot="2" aria-label="Show image 3" aria-current="false"></button>
						</div>
						<button class="gallery__arrow" type="button" data-gallery-next aria-label="Next image">→</button>
					</div>
				</div>
			</section>
		</main>

		<footer>
			<p>abam &copy; 2026</p>
		</footer>
		<script src="script.js"></script>
	</body>
</html>
